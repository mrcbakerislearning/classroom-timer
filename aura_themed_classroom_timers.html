<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Theme Focus & Classroom Timer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts for Multi-Theme Skins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@600;800;900&family=Mochiy+Pop+One&family=Outfit:wght@300;400;600;700;800&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* Base typography & utility defaults */
        * {
            user-select: none;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .font-mono-num {
            font-variant-numeric: tabular-nums;
        }

        /* Scanline Overlay for 8-Bit Arcade */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            transition: opacity 0.3s ease;
        }

        /* ------------------------------------------------------------- */
        /* SKIN 1: AURA GLOW (DEEP COSMOS GLASSMORPHISM)                */
        /* ------------------------------------------------------------- */
        body[data-skin="aura"] {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }
        body[data-skin="aura"] .font-timer {
            font-family: 'Space Grotesk', sans-serif;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.4), 0 0 60px rgba(236, 72, 153, 0.25);
        }
        body[data-skin="aura"] .theme-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 1rem;
        }
        body[data-skin="aura"] .theme-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 0.75rem;
        }
        body[data-skin="aura"] .theme-btn:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        /* ------------------------------------------------------------- */
        /* SKIN 2: 8-BIT ARCADE (PANTONE 354 C NEON GREEN MATRIX)        */
        /* ------------------------------------------------------------- */
        body[data-skin="retro"] {
            font-family: 'Press Start 2P', monospace;
            background-color: #05140a; /* Deep Matrix CRT Dark Green */
            color: #00e676; /* Pantone 354 C Neon Green */
        }
        body[data-skin="retro"] .scanlines {
            opacity: 1;
        }
        body[data-skin="retro"] .font-timer {
            font-family: 'Press Start 2P', monospace;
            color: #00e676; /* Pantone 354 C Bright Glow */
            text-shadow: 0 0 12px #00b140, 0 0 24px #00e676, 4px 4px 0px #003814;
        }
        body[data-skin="retro"] .theme-card {
            background: #092112;
            border: 3px solid #00b140; /* Pantone 354 C Solid Border */
            box-shadow: 5px 5px 0px #004d1c, inset 0 0 12px rgba(0, 230, 118, 0.15);
            border-radius: 0px;
        }
        body[data-skin="retro"] .theme-btn {
            background: #0e301b;
            border: 2px solid #00e676;
            color: #00e676;
            border-radius: 0px;
            box-shadow: 3px 3px 0px #003814;
            font-size: 0.75rem;
        }
        body[data-skin="retro"] .theme-btn:hover {
            background: #00b140;
            color: #05140a;
            box-shadow: 3px 3px 0px #00220c;
        }

        /* ------------------------------------------------------------- */
        /* SKIN 3: MANGA / ANIME ACTION (NEON GREEN, LIME, ORANGE, CORAL)*/
        /* ------------------------------------------------------------- */
        body[data-skin="anime"] {
            font-family: 'Mochiy Pop One', sans-serif;
            background-color: #120924; /* Deep Manga Night Background */
            color: #ffffff;
        }
        body[data-skin="anime"] .font-timer {
            font-family: 'Mochiy Pop One', sans-serif;
            color: #c1ff00; /* Lime Yellow */
            text-shadow: 3px 3px 0px #fd4e4e, 6px 6px 0px #120924, 0 0 20px #00ff66;
        }
        body[data-skin="anime"] .theme-card {
            background: rgba(28, 15, 48, 0.92);
            border: 3px solid #00ff66; /* Neon Green */
            box-shadow: 5px 5px 0px #fd4e4e, inset 0 0 15px rgba(255, 204, 0, 0.2);
            border-radius: 1.25rem;
        }
        body[data-skin="anime"] .theme-btn {
            background: #ff8736; /* Manga Orange */
            border: 2px solid #c1ff00; /* Lime Yellow */
            color: #120924;
            font-weight: 900;
            border-radius: 0.75rem;
            box-shadow: 3px 3px 0px #fd4e4e;
        }
        body[data-skin="anime"] .theme-btn:hover {
            background: #00ff66; /* Neon Green */
            color: #120924;
            border-color: #ffcc00;
            box-shadow: 4px 4px 0px #fd4e4e;
            transform: translateY(-2px);
        }

        /* ------------------------------------------------------------- */
        /* SKIN 4: DESERT ART DECO (LIGHT PANTONE SUN & SAND THEME)      */
        /* ------------------------------------------------------------- */
        body[data-skin="deco"] {
            font-family: 'Cinzel', serif;
            background-color: #f7efe5; /* Desert Dust */
            color: #2c1a11; /* Earthen Bark */
        }
        body[data-skin="deco"] .font-timer {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.05em;
            color: #d06a4c; /* Desert Sun */
            text-shadow: 2px 2px 12px rgba(208, 106, 76, 0.25), 0 0 18px rgba(42, 157, 143, 0.2);
        }
        body[data-skin="deco"] .theme-card {
            background: rgba(255, 248, 240, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid #e07a5f;
            box-shadow: 0 10px 30px rgba(208, 106, 76, 0.12), inset 0 0 0 1px rgba(42, 157, 143, 0.3);
            border-radius: 0.75rem;
        }
        body[data-skin="deco"] .theme-btn {
            background: rgba(237, 201, 175, 0.45);
            border: 1.5px solid #d06a4c;
            color: #2c1a11;
            border-radius: 0.5rem;
            font-weight: 700;
        }
        body[data-skin="deco"] .theme-btn:hover {
            background: #2a9d8f; /* Desert Mirage Aqua */
            border-color: #2a9d8f;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(42, 157, 143, 0.35);
            transform: translateY(-1px);
        }

        /* ------------------------------------------------------------- */
        /* SKIN 5: SUPERHERO COMICS (60S MARVEL: CAP, HULK, IRON MAN)    */
        /* ------------------------------------------------------------- */
        body[data-skin="comic"] {
            font-family: 'Bangers', cursive;
            background-color: #0f172a; /* Deep Vintage Comic Navy */
            background-image: radial-gradient(#1e293b 15%, transparent 16%);
            background-size: 16px 16px; /* Halftone Dot Grid */
            color: #ffffff;
            letter-spacing: 0.05em;
        }
        body[data-skin="comic"] .font-timer {
            font-family: 'Bangers', cursive;
            color: #ffc72c; /* Iron Man Arc Gold */
            text-shadow: 4px 4px 0px #a20003, 8px 8px 0px #0a3161; /* Iron Man Red & Cap America Blue */
            letter-spacing: 0.06em;
        }
        body[data-skin="comic"] .theme-card {
            background: #ffffff;
            color: #0a3161;
            border: 3.5px solid #000000; /* Bold Cartoon Stroke */
            box-shadow: 6px 6px 0px #a20003, 10px 10px 0px #0a3161;
            border-radius: 0.75rem;
        }
        body[data-skin="comic"] .theme-btn {
            background: #0a3161; /* Cap America Blue */
            border: 2.5px solid #000000;
            color: #ffc72c; /* Iron Man Gold */
            border-radius: 0.5rem;
            box-shadow: 3px 3px 0px #000000;
            font-size: 1.1rem;
        }
        body[data-skin="comic"] .theme-btn:hover {
            background: #4c9a2a; /* Hulk Gamma Green */
            color: #ffffff;
            border-color: #000000;
            box-shadow: 4px 4px 0px #6b2d82; /* Hulk Purple Shadow */
            transform: translate(-1px, -1px);
        }

        /* General Progress Bar Shimmer & Radial Ring */
        .progress-shimmer {
            position: relative;
            overflow: hidden;
        }
        .progress-shimmer::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.3) 20%,
                rgba(255, 255, 255, 0.6) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .ring-circle {
            transition: stroke-dashoffset 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
    </style>
</head>
<body data-skin="aura" class="min-h-screen overflow-hidden flex flex-col justify-between relative select-none">

    <!-- Background Animated Canvas -->
    <canvas id="auraCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>
    <!-- CRT Scanlines for Retro Mode -->
    <div class="scanlines"></div>

    <!-- Top Progress Bar Indicator -->
    <div id="topProgressBarContainer" class="fixed top-0 left-0 right-0 h-3 bg-black/40 z-30 overflow-hidden">
        <div id="topProgressBar" class="h-full bg-gradient-to-r from-violet-500 via-fuchsia-400 to-amber-300 w-full transition-all duration-300 progress-shimmer"></div>
    </div>

    <!-- Header Navigation Bar -->
    <header class="relative z-20 w-full px-4 sm:px-8 py-4 flex flex-wrap items-center justify-between gap-3" id="headerNav">
        <div class="flex items-center space-x-3">
            <div id="logoBadge" class="p-2.5 rounded-2xl bg-gradient-to-tr from-violet-600 to-fuchsia-500 shadow-lg text-white flex items-center justify-center">
                <i id="logoIcon" data-lucide="sparkles" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 id="appTitle" class="font-bold text-lg sm:text-xl tracking-tight flex items-center gap-2">
                    Classroom Timer
                    <span id="stateBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 hidden">Active</span>
                </h1>
                <p id="appSubtitle" class="text-xs opacity-80">Interactive Multi-Theme Focus Clock</p>
            </div>
        </div>

        <!-- Task Title Input -->
        <div class="theme-card px-4 py-1.5 max-w-xs sm:max-w-sm w-full flex items-center">
            <i data-lucide="edit-3" class="w-4 h-4 mr-2 shrink-0 opacity-70"></i>
            <input type="text" id="taskTitleInput" value="Reading & Silent Focus Time" placeholder="Name your session..." 
                   class="bg-transparent text-xs sm:text-sm font-semibold focus:outline-none w-full text-center">
        </div>

        <!-- Top Right Control Options & Skin Switcher -->
        <div class="flex items-center space-x-2">
            <!-- Mode Switcher Dropdown -->
            <div class="relative">
                <select id="skinSelect" class="theme-btn px-3 py-2 text-xs font-bold cursor-pointer focus:outline-none appearance-none pr-7">
                    <option value="aura">🔮 Aura Glow</option>
                    <option value="retro">👾 8-Bit Arcade (Pantone 354C)</option>
                    <option value="anime">⚡ Manga Action</option>
                    <option value="deco">🏛️ Desert Art Deco</option>
                    <option value="comic">💥 Superhero Comics (60s Marvel)</option>
                </select>
                <i data-lucide="chevron-down" class="w-3.5 h-3.5 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none opacity-70"></i>
            </div>

            <button id="ambientAudioBtn" title="Toggle Soundscape" class="theme-btn p-2.5 flex items-center gap-1.5 text-xs font-semibold">
                <i id="ambientIcon" data-lucide="cloud-rain" class="w-4 h-4 text-sky-400"></i>
                <span class="hidden md:inline" id="ambientLabel">Ambient Audio</span>
            </button>

            <button id="settingsBtn" title="Preferences" class="theme-btn p-2.5">
                <i data-lucide="sliders" class="w-4 h-4"></i>
            </button>

            <button id="fullscreenBtn" title="Toggle Fullscreen" class="theme-btn p-2.5">
                <i id="fullscreenIcon" data-lucide="maximize-2" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Main Focus Countdown Center Screen -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 py-2 w-full max-w-5xl mx-auto text-center">
        
        <!-- Preset Time Quick Switcher Buttons -->
        <div id="presetsContainer" class="flex flex-wrap items-center justify-center gap-2 mb-4 sm:mb-6 max-w-2xl px-2">
            <button data-time="300" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">5M</button>
            <button data-time="600" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">10M</button>
            <button data-time="900" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">15M</button>
            <button data-time="1200" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">20M</button>
            <button data-time="1500" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">25M</button>
            <button data-time="1800" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold opacity-100 ring-2 ring-violet-400">30M</button>
            <button data-time="2700" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">45M</button>
            <button id="customTimeBtn" class="theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold flex items-center gap-1">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i> Custom
            </button>
        </div>

        <!-- Big Display Clock & Center Dynamic Visuals -->
        <div class="relative w-full flex flex-col items-center justify-center my-auto">
            
            <!-- Optional Radial Ring Progress Overlay -->
            <div id="radialRingWrapper" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-500 scale-105">
                <svg class="w-72 h-72 sm:w-96 sm:h-96" viewBox="0 0 100 100">
                    <circle class="opacity-20" stroke-width="4" stroke="currentColor" fill="transparent" r="42" cx="50" cy="50"/>
                    <circle id="radialRingProgress" class="ring-circle text-amber-400" stroke-width="4" stroke-dasharray="263.89" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="42" cx="50" cy="50"/>
                </svg>
            </div>

            <!-- Task Display Title -->
            <h2 id="activeTaskDisplay" class="text-sm sm:text-lg font-bold tracking-wider uppercase mb-1 drop-shadow">
                Reading & Silent Focus Time
            </h2>

            <!-- Digital Timer Numbers -->
            <div id="timeDisplay" class="font-timer font-extrabold text-7xl sm:text-8xl md:text-9xl lg:text-[11rem] tracking-tight leading-none my-1 transition-all duration-300">
                30:00
            </div>

            <!-- Subtitle Info (Elapsed / Remaining) -->
            <div class="flex items-center justify-center gap-6 text-xs sm:text-sm font-bold opacity-90 my-2">
                <span id="elapsedDisplay" class="flex items-center gap-1.5"><i data-lucide="history" class="w-4 h-4"></i> Elapsed: 00:00</span>
                <span>•</span>
                <span id="percentDisplay" class="flex items-center gap-1.5"><i data-lucide="pie-chart" class="w-4 h-4"></i> 100% Left</span>
            </div>

            <!-- Prominent Visual Main Progress Bar -->
            <div id="mainProgressBarContainer" class="w-full max-w-2xl px-4 mt-2 mb-4">
                <div class="theme-card p-2 sm:p-2.5 relative overflow-hidden">
                    <div class="w-full h-8 sm:h-11 bg-black/40 rounded-xl relative overflow-hidden p-1 shadow-inner">
                        <!-- Animated Visual Bar -->
                        <div id="mainProgressBar" class="h-full rounded-lg bg-gradient-to-r from-violet-600 via-fuchsia-500 to-amber-400 w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3">
                            <div class="w-2.5 h-full bg-white/70 rounded-full blur-[1px] animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Action Controls Footer -->
    <footer id="footerControls" class="relative z-20 w-full px-4 pb-6 pt-2 flex flex-col items-center justify-center">
        <div class="theme-card p-2.5 flex items-center space-x-3 sm:space-x-5">
            
            <!-- -1 Min -->
            <button id="minusOneBtn" title="-1 Minute" class="theme-btn p-3">
                <div class="flex items-center text-xs font-bold gap-0.5"><i data-lucide="minus" class="w-4 h-4"></i>1m</div>
            </button>

            <!-- Reset Button -->
            <button id="resetBtn" title="Reset Timer" class="theme-btn p-3.5">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
            </button>

            <!-- MAIN PLAY / PAUSE BUTTON -->
            <button id="playPauseBtn" class="p-5 sm:p-6 theme-btn bg-gradient-to-r from-violet-500 to-pink-500 text-white shadow-xl transform hover:scale-105 active:scale-95 transition-all duration-200 flex items-center justify-center">
                <i id="playPauseIcon" data-lucide="play" class="w-8 h-8 fill-current translate-x-0.5"></i>
            </button>

            <!-- +1 Min -->
            <button id="plusOneBtn" title="+1 Minute" class="theme-btn p-3">
                <div class="flex items-center text-xs font-bold gap-0.5"><i data-lucide="plus" class="w-4 h-4"></i>1m</div>
            </button>

            <!-- +5 Min -->
            <button id="plusFiveBtn" title="+5 Minutes" class="theme-btn p-3">
                <div class="flex items-center text-xs font-bold gap-0.5"><i data-lucide="plus" class="w-4 h-4"></i>5m</div>
            </button>

        </div>

        <p class="text-[11px] opacity-75 mt-3 font-semibold tracking-wide">
            Shortcuts: <kbd class="px-1.5 py-0.5 rounded bg-black/20">Space</kbd> Start/Pause • 
            <kbd class="px-1.5 py-0.5 rounded bg-black/20">R</kbd> Reset • 
            <kbd class="px-1.5 py-0.5 rounded bg-black/20">F</kbd> Fullscreen
        </p>
    </footer>

    <!-- Settings Preferences Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="theme-card w-full max-w-lg p-6 sm:p-8 relative max-h-[90vh] overflow-y-auto">
            
            <div class="flex items-center justify-between pb-4 border-b border-white/20 mb-6">
                <h3 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="settings" class="w-5 h-5"></i> Timer Preferences
                </h3>
                <button id="closeSettingsBtn" class="p-2 theme-btn">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-6 text-left">
                <!-- Theme Mode Select -->
                <div>
                    <label class="block text-sm font-bold mb-2">Visual Mode Skin</label>
                    <div class="grid grid-cols-2 gap-2 text-xs font-bold">
                        <button data-set-skin="aura" class="skin-modal-btn p-3 theme-btn text-left">🔮 Aura Focus</button>
                        <button data-set-skin="retro" class="skin-modal-btn p-3 theme-btn text-left">👾 8-Bit Arcade (Pantone 354C)</button>
                        <button data-set-skin="anime" class="skin-modal-btn p-3 theme-btn text-left">⚡ Manga Action</button>
                        <button data-set-skin="deco" class="skin-modal-btn p-3 theme-btn text-left">🏛️ Desert Art Deco</button>
                        <button data-set-skin="comic" class="skin-modal-btn p-3 theme-btn text-left col-span-2">💥 Superhero Comics (60s Marvel)</button>
                    </div>
                </div>

                <!-- Ambient Audio Generator Selection -->
                <div>
                    <label class="block text-sm font-bold mb-2">Background Sound Generator</label>
                    <select id="ambientSoundSelect" class="w-full p-3 theme-btn text-sm focus:outline-none">
                        <option value="rain">Classroom Soft Rain</option>
                        <option value="synth">Calm Focus Synth Pad</option>
                        <option value="chiptune">8-Bit Retro Chiptune Loop</option>
                        <option value="waves">Warm Ocean Waves</option>
                        <option value="pinknoise">Pink Noise (Deep Focus)</option>
                        <option value="none">Off (Silent)</option>
                    </select>
                </div>

                <!-- End Alarm Bell Tone Selection -->
                <div>
                    <label class="block text-sm font-bold mb-2">Completion End Alarm Sound</label>
                    <div class="flex items-center gap-3">
                        <select id="alarmSoundSelect" class="w-full p-3 theme-btn text-sm focus:outline-none">
                            <option value="singing-bowl">Tibetan Singing Bowl (Calm)</option>
                            <option value="retro-fanfare">8-Bit Level Up Victory Fanfare</option>
                            <option value="anime-chime">Anime Upbeat Magical Chime</option>
                            <option value="deco-gong">Art Deco Brass Egyptian Gong</option>
                            <option value="hero-fanfare">Superhero Victory Brass Fanfare</option>
                        </select>
                        <button id="testAlarmSoundBtn" class="theme-btn px-4 py-3 text-xs font-bold shrink-0 flex items-center gap-1.5">
                            <i data-lucide="volume-2" class="w-4 h-4"></i> Test Sound
                        </button>
                    </div>
                </div>

                <!-- Progress Indicator Layout Style -->
                <div>
                    <label class="block text-sm font-bold mb-2">Progress Indicator Style</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button id="styleBarBtn" class="theme-btn p-3 text-xs font-bold flex items-center justify-center gap-2">
                            <i data-lucide="minus" class="w-4 h-4"></i> Horizontal Bar
                        </button>
                        <button id="styleRingBtn" class="theme-btn p-3 text-xs font-bold flex items-center justify-center gap-2">
                            <i data-lucide="disc" class="w-4 h-4"></i> Radial Ring
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 pt-4 border-t border-white/20 text-right">
                <button id="saveSettingsBtn" class="px-6 py-2.5 theme-btn font-bold text-sm">Done</button>
            </div>
        </div>
    </div>

    <!-- Custom Time Input Modal -->
    <div id="customTimeModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="theme-card w-full max-w-sm p-6 text-center">
            <h3 class="text-xl font-bold mb-4 flex items-center justify-center gap-2">
                <i data-lucide="clock" class="w-5 h-5"></i> Set Custom Time
            </h3>
            
            <div class="flex items-center justify-center gap-3 my-6">
                <div class="flex flex-col items-center">
                    <input type="number" id="customMinutesInput" min="0" max="300" value="12" class="w-20 p-3 theme-btn text-center font-mono-num font-bold text-2xl focus:outline-none">
                    <span class="text-xs font-bold opacity-75 mt-1">Minutes</span>
                </div>
                <span class="text-2xl font-bold">:</span>
                <div class="flex flex-col items-center">
                    <input type="number" id="customSecondsInput" min="0" max="59" value="00" class="w-20 p-3 theme-btn text-center font-mono-num font-bold text-2xl focus:outline-none">
                    <span class="text-xs font-bold opacity-75 mt-1">Seconds</span>
                </div>
            </div>

            <div class="flex gap-3 justify-end">
                <button id="cancelCustomTimeBtn" class="flex-1 py-2.5 theme-btn text-sm font-bold">Cancel</button>
                <button id="applyCustomTimeBtn" class="flex-1 py-2.5 theme-btn text-sm font-bold bg-violet-600 text-white">Apply</button>
            </div>
        </div>
    </div>

    <!-- Timer Finished Completion Modal -->
    <div id="finishedModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-lg flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-500">
        <div class="theme-card w-full max-w-md p-8 text-center transform scale-90 transition-all duration-300" id="finishedModalCard">
            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-amber-400 via-fuchsia-500 to-violet-600 p-0.5 mx-auto mb-5 shadow-2xl animate-bounce flex items-center justify-center">
                <i data-lucide="bell-ring" class="w-10 h-10 text-white"></i>
            </div>
            <h3 id="finishedModalTitle" class="text-3xl font-extrabold tracking-tight mb-2">TIME IS UP!</h3>
            <p id="finishedModalText" class="text-sm font-semibold opacity-90 mb-6">Great focus session! Your timer has completed.</p>
            <button id="dismissFinishedBtn" class="w-full py-3.5 theme-btn bg-gradient-to-r from-violet-600 to-pink-600 text-white font-bold text-base shadow-lg">
                Restart Session
            </button>
        </div>
    </div>

    <script>
        const state = {
            totalSeconds: 1800,
            remainingSeconds: 1800,
            isRunning: false,
            timerInterval: null,
            endTime: null,
            skin: 'aura',
            ambientSound: 'rain',
            alarmSound: 'singing-bowl',
            progressStyle: 'bar',
            audioCtx: null,
            ambientNodes: null,
            ambientPlaying: false
        };

        const canvas = document.getElementById('auraCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 20 + 5;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.05;
                this.color = '#ffffff';
                this.type = 'circle';

                if (state.skin === 'aura') {
                    this.size = Math.random() * (width * 0.3) + (width * 0.15);
                    const colors = ['#8b5cf6', '#ec4899', '#f59e0b', '#3b82f6'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.alpha = Math.random() * 0.35 + 0.15;
                } else if (state.skin === 'retro') {
                    /* Pantone 354 C 8-Bit Arcade Pixels */
                    this.size = Math.floor(Math.random() * 8 + 4) * 2;
                    const pantone354CColors = ['#00b140', '#00e676', '#69f0ae', '#00e5ff', '#003814'];
                    this.color = pantone354CColors[Math.floor(Math.random() * pantone354CColors.length)];
                    this.speedY = -(Math.random() * 2.5 + 0.8); // Matrix upward float
                    this.speedX = (Math.random() - 0.5) * 0.5;
                } else if (state.skin === 'anime') {
                    /* Requested Manga Palette: Neon Green, Lime Yellow, Vibrant Yellow, Manga Orange, Coral Red */
                    this.size = Math.random() * 18 + 8;
                    const mangaColors = [
                        '#00ff66', /* Neon Green */
                        '#c1ff00', /* Lime Yellow */
                        '#ffcc00', /* Vibrant Yellow */
                        '#ff8736', /* Manga Orange */
                        '#fd4e4e'  /* Coral Red */
                    ];
                    this.color = mangaColors[Math.floor(Math.random() * mangaColors.length)];
                    this.speedX = (Math.random() - 0.5) * 3.5; // High energy speed lines
                    this.speedY = (Math.random() - 0.5) * 3.5;
                } else if (state.skin === 'deco') {
                    this.size = Math.random() * 16 + 8;
                    /* Pantone Desert Dust, Sand, Sun & Mirage Accents */
                    const colors = ['#e07a5f', '#d1b280', '#e3c8b0', '#2a9d8f', '#00b4d8', '#f4a261'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.speedY = -(Math.random() * 0.8 + 0.2);
                } else if (state.skin === 'comic') {
                    /* 60s Marvel Comics: Captain America, The Hulk, Iron Man */
                    this.size = Math.random() * 22 + 10;
                    const types = ['star', 'hulk-gamma', 'iron-repulsor'];
                    this.type = types[Math.floor(Math.random() * types.length)];
                    
                    if (this.type === 'star') {
                        /* Cap America Star & Shield Palette */
                        const capColors = ['#ffffff', '#0a3161', '#c8102e'];
                        this.color = capColors[Math.floor(Math.random() * capColors.length)];
                    } else if (this.type === 'hulk-gamma') {
                        /* Hulk Gamma Radiation Palette */
                        const hulkColors = ['#4c9a2a', '#6b2d82', '#9333ea'];
                        this.color = hulkColors[Math.floor(Math.random() * hulkColors.length)];
                    } else {
                        /* Iron Man Armor & Arc Gold Palette */
                        const ironColors = ['#ffc72c', '#a20003', '#f59e0b'];
                        this.color = ironColors[Math.floor(Math.random() * ironColors.length)];
                    }
                }
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotSpeed;

                if (this.x < -100) this.x = width + 100;
                if (this.x > width + 100) this.x = -100;
                if (this.y < -100) this.y = height + 100;
                if (this.y > height + 100) this.y = -100;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (state.skin === 'aura') {
                    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                    g.addColorStop(0, this.color);
                    g.addColorStop(1, 'transparent');
                    ctx.globalAlpha = this.alpha || 0.3;
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (state.skin === 'retro') {
                    /* Pantone 354 C Glowing Pixels */
                    ctx.shadowColor = '#00e676';
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                } else if (state.skin === 'anime') {
                    /* Manga Action Stars & Diamond Sparks */
                    ctx.fillStyle = this.color;
                    ctx.strokeStyle = '#120924';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    // Draw 4-point manga star burst
                    const s = this.size;
                    ctx.moveTo(0, -s);
                    ctx.quadraticCurveTo(0, 0, s, 0);
                    ctx.quadraticCurveTo(0, 0, 0, s);
                    ctx.quadraticCurveTo(0, 0, -s, 0);
                    ctx.quadraticCurveTo(0, 0, 0, -s);
                    ctx.fill();
                    ctx.stroke();
                } else if (state.skin === 'deco') {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size);
                    ctx.lineTo(this.size / 1.5, 0);
                    ctx.lineTo(0, this.size);
                    ctx.lineTo(-this.size / 1.5, 0);
                    ctx.closePath();
                    ctx.stroke();
                } else if (state.skin === 'comic') {
                    /* 60s Marvel Action Particles */
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 3;
                    ctx.fillStyle = this.color;

                    if (this.type === 'star') {
                        // Captain America 5-Point Star
                        ctx.beginPath();
                        for (let i = 0; i < 5; i++) {
                            ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.size,
                                       -Math.sin((18 + i * 72) * Math.PI / 180) * this.size);
                            ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.size / 2),
                                       -Math.sin((54 + i * 72) * Math.PI / 180) * (this.size / 2));
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    } else if (this.type === 'hulk-gamma') {
                        // Hulk Gamma Radiation Glowing Orb
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    } else {
                        // Iron Man Repulsor Ring
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                        ctx.stroke();
                    }
                }

                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = state.skin === 'aura' ? 6 : (state.skin === 'retro' ? 30 : 22);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            // Canvas background shading per skin
            if (state.skin === 'aura') ctx.fillStyle = '#020617';
            else if (state.skin === 'retro') ctx.fillStyle = '#05140a'; // Pantone 354 C Matrix CRT Dark
            else if (state.skin === 'anime') ctx.fillStyle = '#120924'; // Manga Deep Purple
            else if (state.skin === 'deco') ctx.fillStyle = '#f7efe5'; // Light Desert Dust
            else if (state.skin === 'comic') ctx.fillStyle = '#0f172a'; // 60s Marvel Newsprint Navy

            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animateCanvas);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateCanvas();

        function getAudioContext() {
            if (!state.audioCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                state.audioCtx = new AudioCtx();
            }
            if (state.audioCtx.state === 'suspended') {
                state.audioCtx.resume();
            }
            return state.audioCtx;
        }

        function playAlarmSound(type) {
            const ac = getAudioContext();
            const now = ac.currentTime;

            if (type === 'singing-bowl') {
                [216, 432, 648].forEach((f, idx) => {
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    osc.frequency.setValueAtTime(f, now);
                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.exponentialRampToValueAtTime(0.3 / (idx + 1), now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);
                    osc.connect(gain);
                    gain.connect(ac.destination);
                    osc.start(now);
                    osc.stop(now + 4.1);
                });
            } else if (type === 'retro-fanfare') {
                // Pantone 354C / 8-Bit Chiptune Arpeggio Victory Melody
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    const st = now + idx * 0.12;
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, st);
                    gain.gain.setValueAtTime(0.2, st);
                    gain.gain.exponentialRampToValueAtTime(0.001, st + 0.2);
                    osc.connect(gain);
                    gain.connect(ac.destination);
                    osc.start(st);
                    osc.stop(st + 0.22);
                });
            } else if (type === 'anime-chime') {
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                notes.forEach((freq, idx) => {
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    const st = now + idx * 0.1;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, st);
                    gain.gain.setValueAtTime(0.3, st);
                    gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.8);
                    osc.connect(gain);
                    gain.connect(ac.destination);
                    osc.start(st);
                    osc.stop(st + 0.85);
                });
            } else if (type === 'deco-gong') {
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(146.83, now);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.5);
                osc.connect(gain);
                gain.connect(ac.destination);
                osc.start(now);
                osc.stop(now + 3.6);
            } else if (type === 'hero-fanfare') {
                const notes = [349.23, 440.00, 523.25, 698.46]; // 60s Marvel Brass chord fanfare
                notes.forEach((freq) => {
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
                    osc.connect(gain);
                    gain.connect(ac.destination);
                    osc.start(now);
                    osc.stop(now + 2.1);
                });
            }
        }

        function toggleAmbientSound(forceState) {
            const ac = getAudioContext();

            if (state.ambientPlaying || forceState === false) {
                if (state.ambientNodes) {
                    try { state.ambientNodes.stop(); } catch(e){}
                    state.ambientNodes = null;
                }
                state.ambientPlaying = false;
                ambientAudioBtn.classList.remove('ring-2', 'ring-sky-400');
                return;
            }

            if (state.ambientSound === 'none') return;

            const bufferSize = 2 * ac.sampleRate;
            const noiseBuffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
            const output = noiseBuffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = ac.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const filter = ac.createBiquadFilter();
            filter.type = state.ambientSound === 'chiptune' ? 'bandpass' : 'lowpass';
            filter.frequency.value = state.ambientSound === 'rain' ? 800 : 1200;

            const gain = ac.createGain();
            gain.gain.value = 0.12;

            whiteNoise.connect(filter);
            filter.connect(gain);
            gain.connect(ac.destination);

            whiteNoise.start();
            state.ambientNodes = whiteNoise;
            state.ambientPlaying = true;
            ambientAudioBtn.classList.add('ring-2', 'ring-sky-400');
        }

        function formatTime(totalSec) {
            const mins = Math.floor(totalSec / 60);
            const secs = totalSec % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            const timeDisplay = document.getElementById('timeDisplay');
            timeDisplay.textContent = formatTime(state.remainingSeconds);
            document.title = `${formatTime(state.remainingSeconds)} - ${taskTitleInput.value || 'Timer'}`;

            const elapsedSec = state.totalSeconds - state.remainingSeconds;
            document.getElementById('elapsedDisplay').innerHTML = `<i data-lucide="history" class="w-4 h-4"></i> Elapsed: ${formatTime(elapsedSec)}`;
            
            const percentRemaining = state.totalSeconds > 0 ? (state.remainingSeconds / state.totalSeconds) * 100 : 0;
            document.getElementById('percentDisplay').innerHTML = `<i data-lucide="pie-chart" class="w-4 h-4"></i> ${Math.round(percentRemaining)}% Left`;

            document.getElementById('topProgressBar').style.width = `${percentRemaining}%`;
            document.getElementById('mainProgressBar').style.width = `${percentRemaining}%`;

            const circumference = 263.89;
            const offset = circumference - (percentRemaining / 100) * circumference;
            document.getElementById('radialRingProgress').style.strokeDashoffset = offset;

            lucide.createIcons();
        }

        function startTimer() {
            if (state.isRunning || state.remainingSeconds <= 0) return;
            getAudioContext();
            state.isRunning = true;
            state.endTime = Date.now() + state.remainingSeconds * 1000;

            document.getElementById('stateBadge').classList.remove('hidden');
            document.getElementById('playPauseIcon').setAttribute('data-lucide', 'pause');

            state.timerInterval = setInterval(() => {
                const now = Date.now();
                const diff = Math.max(0, Math.round((state.endTime - now) / 1000));
                state.remainingSeconds = diff;

                updateDisplay();

                if (diff <= 0) {
                    completeTimer();
                }
            }, 200);

            lucide.createIcons();
        }

        function pauseTimer() {
            if (!state.isRunning) return;
            state.isRunning = false;
            clearInterval(state.timerInterval);

            document.getElementById('stateBadge').classList.add('hidden');
            document.getElementById('playPauseIcon').setAttribute('data-lucide', 'play');
            lucide.createIcons();
        }

        function resetTimer(newSeconds = state.totalSeconds) {
            pauseTimer();
            state.totalSeconds = newSeconds;
            state.remainingSeconds = newSeconds;
            updateDisplay();
        }

        function completeTimer() {
            pauseTimer();
            playAlarmSound(state.alarmSound);

            const finishedModal = document.getElementById('finishedModal');
            const finishedModalCard = document.getElementById('finishedModalCard');
            finishedModal.classList.remove('opacity-0', 'pointer-events-none');
            finishedModalCard.classList.remove('scale-90');
            finishedModalCard.classList.add('scale-100');
        }

        function switchSkin(skinName) {
            state.skin = skinName;
            document.body.setAttribute('data-skin', skinName);
            document.getElementById('skinSelect').value = skinName;

            const logoIcon = document.getElementById('logoIcon');
            const mainProgressBar = document.getElementById('mainProgressBar');
            const topProgressBar = document.getElementById('topProgressBar');
            
            if (skinName === 'aura') {
                logoIcon.setAttribute('data-lucide', 'sparkles');
                state.alarmSound = 'singing-bowl';
                mainProgressBar.className = 'h-full rounded-lg bg-gradient-to-r from-violet-600 via-fuchsia-500 to-amber-400 w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3';
                topProgressBar.className = 'h-full bg-gradient-to-r from-violet-500 via-fuchsia-400 to-amber-300 w-full transition-all duration-300 progress-shimmer';
            } else if (skinName === 'retro') {
                logoIcon.setAttribute('data-lucide', 'gamepad-2');
                state.alarmSound = 'retro-fanfare';
                /* Pantone 354 C Arcade Green Progress Gradient */
                mainProgressBar.className = 'h-full rounded-lg bg-gradient-to-r from-[#003814] via-[#00b140] to-[#00e676] w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3';
                topProgressBar.className = 'h-full bg-gradient-to-r from-[#00b140] to-[#00e676] w-full transition-all duration-300 progress-shimmer';
            } else if (skinName === 'anime') {
                logoIcon.setAttribute('data-lucide', 'zap');
                state.alarmSound = 'anime-chime';
                /* Manga Colors Gradient: Neon Green -> Lime Yellow -> Orange -> Coral Red */
                mainProgressBar.className = 'h-full rounded-lg bg-gradient-to-r from-[#00ff66] via-[#c1ff00] via-[#ffcc00] via-[#ff8736] to-[#fd4e4e] w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3';
                topProgressBar.className = 'h-full bg-gradient-to-r from-[#00ff66] via-[#ffcc00] to-[#fd4e4e] w-full transition-all duration-300 progress-shimmer';
            } else if (skinName === 'deco') {
                logoIcon.setAttribute('data-lucide', 'crown');
                state.alarmSound = 'deco-gong';
                mainProgressBar.className = 'h-full rounded-lg bg-gradient-to-r from-[#e07a5f] via-[#d1b280] to-[#2a9d8f] w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3';
                topProgressBar.className = 'h-full bg-gradient-to-r from-[#e07a5f] via-[#2a9d8f] to-[#00b4d8] w-full transition-all duration-300 progress-shimmer';
            } else if (skinName === 'comic') {
                logoIcon.setAttribute('data-lucide', 'flame');
                state.alarmSound = 'hero-fanfare';
                /* 60s Marvel Superheroes: Cap America Navy -> Hulk Purple & Green -> Iron Man Red & Gold */
                mainProgressBar.className = 'h-full rounded-lg bg-gradient-to-r from-[#0a3161] via-[#6b2d82] via-[#4c9a2a] via-[#a20003] to-[#ffc72c] w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3';
                topProgressBar.className = 'h-full bg-gradient-to-r from-[#0a3161] via-[#4c9a2a] to-[#ffc72c] w-full transition-all duration-300 progress-shimmer';
            }

            document.getElementById('alarmSoundSelect').value = state.alarmSound;

            initParticles();
            lucide.createIcons();
            updateDisplay();
        }

        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (state.isRunning) pauseTimer();
            else startTimer();
        });

        document.getElementById('resetBtn').addEventListener('click', () => resetTimer());

        document.getElementById('plusOneBtn').addEventListener('click', () => {
            state.totalSeconds += 60;
            state.remainingSeconds += 60;
            if (state.isRunning) state.endTime += 60000;
            updateDisplay();
        });

        document.getElementById('plusFiveBtn').addEventListener('click', () => {
            state.totalSeconds += 300;
            state.remainingSeconds += 300;
            if (state.isRunning) state.endTime += 300000;
            updateDisplay();
        });

        document.getElementById('minusOneBtn').addEventListener('click', () => {
            if (state.remainingSeconds <= 60) return;
            state.totalSeconds = Math.max(1, state.totalSeconds - 60);
            state.remainingSeconds -= 60;
            if (state.isRunning) state.endTime -= 60000;
            updateDisplay();
        });

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const timeSec = parseInt(btn.getAttribute('data-time'), 10);
                resetTimer(timeSec);
            });
        });

        const taskTitleInput = document.getElementById('taskTitleInput');
        taskTitleInput.addEventListener('input', (e) => {
            document.getElementById('activeTaskDisplay').textContent = e.target.value || 'Focus Session';
        });

        document.getElementById('skinSelect').addEventListener('change', (e) => {
            switchSkin(e.target.value);
        });

        document.querySelectorAll('.skin-modal-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchSkin(btn.getAttribute('data-set-skin'));
            });
        });

        // Settings Modal
        const settingsModal = document.getElementById('settingsModal');
        document.getElementById('settingsBtn').addEventListener('click', () => {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
        });
        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
        });
        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            state.ambientSound = document.getElementById('ambientSoundSelect').value;
            state.alarmSound = document.getElementById('alarmSoundSelect').value;
            if (state.ambientPlaying) {
                toggleAmbientSound(false);
                toggleAmbientSound(true);
            }
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
        });

        document.getElementById('testAlarmSoundBtn').addEventListener('click', () => {
            playAlarmSound(document.getElementById('alarmSoundSelect').value);
        });

        // Custom Time Modal
        const customTimeModal = document.getElementById('customTimeModal');
        document.getElementById('customTimeBtn').addEventListener('click', () => {
            customTimeModal.classList.remove('opacity-0', 'pointer-events-none');
        });
        document.getElementById('cancelCustomTimeBtn').addEventListener('click', () => {
            customTimeModal.classList.add('opacity-0', 'pointer-events-none');
        });
        document.getElementById('applyCustomTimeBtn').addEventListener('click', () => {
            const mins = parseInt(document.getElementById('customMinutesInput').value, 10) || 0;
            const secs = parseInt(document.getElementById('customSecondsInput').value, 10) || 0;
            resetTimer(Math.max(1, mins * 60 + secs));
            customTimeModal.classList.add('opacity-0', 'pointer-events-none');
        });

        document.getElementById('dismissFinishedBtn').addEventListener('click', () => {
            document.getElementById('finishedModal').classList.add('opacity-0', 'pointer-events-none');
            resetTimer();
        });

        document.getElementById('ambientAudioBtn').addEventListener('click', () => {
            toggleAmbientSound();
        });

        // Fullscreen Toggle
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                document.getElementById('fullscreenIcon').setAttribute('data-lucide', 'minimize-2');
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                document.getElementById('fullscreenIcon').setAttribute('data-lucide', 'maximize-2');
            }
            lucide.createIcons();
        });

        // Progress bar vs ring switcher
        const styleBarBtn = document.getElementById('styleBarBtn');
        const styleRingBtn = document.getElementById('styleRingBtn');
        const mainProgressBarContainer = document.getElementById('mainProgressBarContainer');
        const radialRingWrapper = document.getElementById('radialRingWrapper');

        styleBarBtn.addEventListener('click', () => {
            mainProgressBarContainer.classList.remove('hidden');
            radialRingWrapper.classList.add('opacity-0');
        });

        styleRingBtn.addEventListener('click', () => {
            mainProgressBarContainer.classList.add('hidden');
            radialRingWrapper.classList.remove('opacity-0');
        });

        // Key shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); document.getElementById('playPauseBtn').click(); }
            else if (e.code === 'KeyR') document.getElementById('resetBtn').click();
            else if (e.code === 'KeyF') fullscreenBtn.click();
        });

        window.onload = function() {
            lucide.createIcons();
            updateDisplay();
        };
    </script>
</body>
</html>
