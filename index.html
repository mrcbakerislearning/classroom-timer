<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Theme Focus & Classroom Timer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts for Multi-Theme Skins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@600;800;900&family=Mochiy+Pop+One&family=Outfit:wght@300;400;600;700;800&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* Base typography & utility defaults */
        * {
            user-select: none;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .font-mono-num {
            font-variant-numeric: tabular-nums;
        }

        /* Scanline Overlay for 8-Bit Arcade */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            transition: opacity 0.3s ease;
        }

        /* ------------------------------------------------------------- */
        /* SKIN 1: AURA GLOW (DEEP COSMOS GLASSMORPHISM)                */
        /* ------------------------------------------------------------- */
        body[data-skin="aura"] {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }
        body[data-skin="aura"] .font-timer {
            font-family: 'Space Grotesk', sans-serif;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.4), 0 0 60px rgba(236, 72, 153, 0.25);
        }
        body[data-skin="aura"] .theme-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 1rem;
        }
        body[data-skin="aura"] .theme-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 0.75rem;
        }
        body[data-skin="aura"] .theme-btn:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        /* ------------------------------------------------------------- */
        /* SKIN 2: 8-BIT ARCADE (PANTONE 354 C NEON GREEN MATRIX)        */
        /* ------------------------------------------------------------- */
        body[data-skin="retro"] {
            font-family: 'Press Start 2P', monospace;
            background-color: #05140a; /* Deep Matrix CRT Dark Green */
            color: #00e676; /* Pantone 354 C Neon Green */
        }
        body[data-skin="retro"] .scanlines {
            opacity: 1;
        }
        body[data-skin="retro"] .font-timer {
            font-family: 'Press Start 2P', monospace;
            color: #00e676; /* Pantone 354 C Bright Glow */
            text-shadow: 0 0 12px #00b140, 0 0 24px #00e676, 4px 4px 0px #003814;
        }
        body[data-skin="retro"] .theme-card {
            background: #092112;
            border: 3px solid #00b140; /* Pantone 354 C Solid Border */
            box-shadow: 5px 5px 0px #004d1c, inset 0 0 12px rgba(0, 230, 118, 0.15);
            border-radius: 0px;
        }
        body[data-skin="retro"] .theme-btn {
            background: #0e301b;
            border: 2px solid #00e676;
            color: #00e676;
            border-radius: 0px;
            box-shadow: 3px 3px 0px #003814;
            font-size: 0.75rem;
        }
        body[data-skin="retro"] .theme-btn:hover {
            background: #00b140;
            color: #05140a;
            box-shadow: 3px 3px 0px #00220c;
        }

        /* ------------------------------------------------------------- */
        /* SKIN 3: MANGA / ANIME ACTION (NEON GREEN, LIME, ORANGE, CORAL)*/
        /* ------------------------------------------------------------- */
        body[data-skin="anime"] {
            font-family: 'Mochiy Pop One', sans-serif;
            background-color: #120924; /* Deep Manga Night Background */
            color: #ffffff;
        }
        body[data-skin="anime"] .font-timer {
            font-family: 'Mochiy Pop One', sans-serif;
            color: #c1ff00; /* Lime Yellow */
            text-shadow: 3px 3px 0px #fd4e4e, 6px 6px 0px #120924, 0 0 20px #00ff66;
        }
        body[data-skin="anime"] .theme-card {
            background: rgba(28, 15, 48, 0.92);
            border: 3px solid #00ff66; /* Neon Green */
            box-shadow: 5px 5px 0px #fd4e4e, inset 0 0 15px rgba(255, 204, 0, 0.2);
            border-radius: 1.25rem;
        }
        body[data-skin="anime"] .theme-btn {
            background: #ff8736; /* Manga Orange */
            border: 2px solid #c1ff00; /* Lime Yellow */
            color: #120924;
            font-weight: 900;
            border-radius: 0.75rem;
            box-shadow: 3px 3px 0px #fd4e4e;
        }
        body[data-skin="anime"] .theme-btn:hover {
            background: #00ff66; /* Neon Green */
            color: #120924;
            border-color: #ffcc00;
            box-shadow: 4px 4px 0px #fd4e4e;
            transform: translateY(-2px);
        }

        /* ------------------------------------------------------------- */
        /* SKIN 4: DESERT ART DECO (LIGHT PANTONE SUN & SAND THEME)      */
        /* ------------------------------------------------------------- */
        body[data-skin="deco"] {
            font-family: 'Cinzel', serif;
            background-color: #f7efe5; /* Desert Dust */
            color: #2c1a11; /* Earthen Bark */
        }
        body[data-skin="deco"] .font-timer {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.05em;
            color: #d06a4c; /* Desert Sun */
            text-shadow: 2px 2px 12px rgba(208, 106, 76, 0.25), 0 0 18px rgba(42, 157, 143, 0.2);
        }
        body[data-skin="deco"] .theme-card {
            background: rgba(255, 248, 240, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid #e07a5f;
            box-shadow: 0 10px 30px rgba(208, 106, 76, 0.12), inset 0 0 0 1px rgba(42, 157, 143, 0.3);
            border-radius: 0.75rem;
        }
        body[data-skin="deco"] .theme-btn {
            background: rgba(237, 201, 175, 0.45);
            border: 1.5px solid #d06a4c;
            color: #2c1a11;
            border-radius: 0.5rem;
            font-weight: 700;
        }
        body[data-skin="deco"] .theme-btn:hover {
            background: #2a9d8f; /* Desert Mirage Aqua */
            border-color: #2a9d8f;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(42, 157, 143, 0.35);
            transform: translateY(-1px);
        }

        /* ------------------------------------------------------------- */
        /* SKIN 5: SUPERHERO COMICS (60S MARVEL: CAP, HULK, IRON MAN)    */
        /* ------------------------------------------------------------- */
        body[data-skin="comic"] {
            font-family: 'Bangers', cursive;
            background-color: #0f172a; /* Deep Vintage Comic Navy */
            background-image: radial-gradient(#1e293b 15%, transparent 16%);
            background-size: 16px 16px; /* Halftone Dot Grid */
            color: #ffffff;
            letter-spacing: 0.05em;
        }
        body[data-skin="comic"] .font-timer {
            font-family: 'Bangers', cursive;
            color: #ffc72c; /* Iron Man Arc Gold */
            text-shadow: 4px 4px 0px #a20003, 8px 8px 0px #0a3161; /* Iron Man Red & Cap America Blue */
            letter-spacing: 0.06em;
        }
        body[data-skin="comic"] .theme-card {
            background: #ffffff;
            color: #0a3161;
            border: 3.5px solid #000000; /* Bold Cartoon Stroke */
            box-shadow: 6px 6px 0px #a20003, 10px 10px 0px #0a3161;
            border-radius: 0.75rem;
        }
        body[data-skin="comic"] .theme-btn {
            background: #0a3161; /* Cap America Blue */
            border: 2.5px solid #000000;
            color: #ffc72c; /* Iron Man Gold */
            border-radius: 0.5rem;
            box-shadow: 3px 3px 0px #000000;
            font-size: 1.1rem;
        }
        body[data-skin="comic"] .theme-btn:hover {
            background: #4c9a2a; /* Hulk Gamma Green */
            color: #ffffff;
            border-color: #000000;
            box-shadow: 4px 4px 0px #6b2d82; /* Hulk Purple Shadow */
            transform: translate(-1px, -1px);
        }

        /* General Progress Bar Shimmer & Radial Ring */
        .progress-shimmer {
            position: relative;
            overflow: hidden;
        }
        .progress-shimmer::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.3) 20%,
                rgba(255, 255, 255, 0.6) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .ring-circle {
            transition: stroke-dashoffset 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
    </style>

    <!-- Firestore Cloud State Persistence Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'classroom-timer-app';
        let db = null;
        let auth = null;

        if (typeof __firebase_config !== 'undefined') {
            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
            } catch (e) {
                console.warn("Firebase initialization skipped or config absent:", e);
            }
        }

        async function initCloudPersistence() {
            if (!auth || !db) return;

            let user = null;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const userCred = await signInWithCustomToken(auth, __initial_auth_token);
                    user = userCred.user;
                } else {
                    const userCred = await signInAnonymously(auth);
                    user = userCred.user;
                }
            } catch (err) {
                console.warn("Auth initialization error for cloud state:", err);
                return;
            }

            if (!user) return;
            const userId = user.uid;
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'settings', 'preferences');

            // Global helper function to persist user state
            window.saveUserSettings = async function(overrides = {}) {
                if (!user || !db) return;
                try {
                    const payload = {
                        skin: state.skin,
                        taskTitle: document.getElementById('taskTitleInput')?.value || '',
                        ambientSound: state.ambientSound,
                        alarmSound: state.alarmSound,
                        totalSeconds: state.totalSeconds,
                        progressStyle: document.getElementById('mainProgressBarContainer')?.classList.contains('hidden') ? 'ring' : 'bar',
                        updatedAt: Date.now(),
                        ...overrides
                    };
                    await setDoc(docRef, payload, { merge: true });
                } catch (e) {
                    console.warn("Could not save settings to cloud:", e);
                }
            };

            // Restore saved settings on startup
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const saved = docSnap.data();
                    if (saved.skin && typeof switchSkin === 'function') {
                        switchSkin(saved.skin);
                    }
                    if (saved.taskTitle) {
                        const titleInput = document.getElementById('taskTitleInput');
                        const displayTitle = document.getElementById('activeTaskDisplay');
                        if (titleInput) titleInput.value = saved.taskTitle;
                        if (displayTitle) displayTitle.textContent = saved.taskTitle;
                    }
                    if (saved.ambientSound && typeof setAmbientSound === 'function') {
                        setAmbientSound(saved.ambientSound);
                    }
                    if (saved.alarmSound) {
                        state.alarmSound = saved.alarmSound;
                        const alarmSelect = document.getElementById('alarmSoundSelect');
                        if (alarmSelect) alarmSelect.value = saved.alarmSound;
                    }
                    if (saved.totalSeconds && typeof resetTimer === 'function') {
                        resetTimer(saved.totalSeconds);
                    }
                    if (saved.progressStyle === 'ring') {
                        document.getElementById('styleRingBtn')?.click();
                    } else if (saved.progressStyle === 'bar') {
                        document.getElementById('styleBarBtn')?.click();
                    }
                }
            } catch (e) {
                console.warn("Could not load settings from cloud:", e);
            }
        }

        window.addEventListener('load', () => {
            initCloudPersistence();
        });
    </script>
</head>
<body data-skin="aura" class="min-h-screen overflow-hidden flex flex-col justify-between relative select-none">

    <!-- Background Animated Canvas -->
    <canvas id="auraCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>
    <!-- CRT Scanlines for Retro Mode -->
    <div class="scanlines"></div>

    <!-- Top Progress Bar Indicator -->
    <div id="topProgressBarContainer" class="fixed top-0 left-0 right-0 h-3 bg-black/40 z-30 overflow-hidden">
        <div id="topProgressBar" class="h-full bg-gradient-to-r from-violet-500 via-fuchsia-400 to-amber-300 w-full transition-all duration-300 progress-shimmer"></div>
    </div>

    <!-- Header Navigation Bar -->
    <header class="relative z-20 w-full px-4 sm:px-8 py-4 flex flex-wrap items-center justify-between gap-3" id="headerNav">
        <div class="flex items-center space-x-3">
            <div id="logoBadge" class="p-2.5 rounded-2xl bg-gradient-to-tr from-violet-600 to-fuchsia-500 shadow-lg text-white flex items-center justify-center">
                <i id="logoIcon" data-lucide="sparkles" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 id="appTitle" class="font-bold text-lg sm:text-xl tracking-tight flex items-center gap-2">
                    Classroom Timer
                    <span id="stateBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 hidden">Active</span>
                </h1>
                <p id="appSubtitle" class="text-xs opacity-80">Interactive Multi-Theme Focus Clock</p>
            </div>
        </div>

        <!-- Task Title Input -->
        <div class="theme-card px-4 py-1.5 max-w-xs sm:max-w-sm w-full flex items-center">
            <i data-lucide="edit-3" class="w-4 h-4 mr-2 shrink-0 opacity-70"></i>
            <input type="text" id="taskTitleInput" value="Reading & Silent Focus Time" placeholder="Name your session..." 
                   class="bg-transparent text-xs sm:text-sm font-semibold focus:outline-none w-full text-center">
        </div>

        <!-- Top Right Control Options & Skin Switcher -->
        <div class="flex items-center space-x-2">
            <!-- Mode Switcher Dropdown -->
            <div class="relative">
                <select id="skinSelect" class="theme-btn px-3 py-2 text-xs font-bold cursor-pointer focus:outline-none appearance-none pr-7">
                    <option value="aura">🔮 Aura Glow</option>
                    <option value="retro">👾 8-Bit Arcade (Pantone 354C)</option>
                    <option value="anime">⚡ Manga Action</option>
                    <option value="deco">🏛️ Desert Art Deco</option>
                    <option value="comic">💥 Superhero Comics (60s Marvel)</option>
                </select>
                <i data-lucide="chevron-down" class="w-3.5 h-3.5 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none opacity-70"></i>
            </div>

            <!-- Header Ambient Sound Select Dropdown -->
            <div class="relative">
                <select id="ambientHeaderSelect" class="theme-btn px-3 py-2 text-xs font-bold cursor-pointer focus:outline-none appearance-none pr-7">
                    <option value="none">🔇 Sound Off</option>
                    <option value="rain">🌧️ Soft Rain</option>
                    <option value="synth">🌌 Focus Synth</option>
                    <option value="chiptune" selected>👾 8-Bit Poly Chiptune</option>
                    <option value="heroic">🦸 Heroic Brass Theme</option>
                    <option value="waves">🌊 Ocean Waves</option>
                    <option value="pinknoise">🎧 Pink Noise</option>
                </select>
                <i data-lucide="volume-2" class="w-3.5 h-3.5 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none opacity-70"></i>
            </div>

            <button id="settingsBtn" title="Preferences" class="theme-btn p-2.5">
                <i data-lucide="sliders" class="w-4 h-4"></i>
            </button>

            <button id="fullscreenBtn" title="Toggle Fullscreen" class="theme-btn p-2.5">
                <i id="fullscreenIcon" data-lucide="maximize-2" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Main Focus Countdown Center Screen -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 py-2 w-full max-w-5xl mx-auto text-center">
        
        <!-- Preset Time Quick Switcher Buttons -->
        <div id="presetsContainer" class="flex flex-wrap items-center justify-center gap-2 mb-4 sm:mb-6 max-w-2xl px-2">
            <button data-time="300" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">5M</button>
            <button data-time="600" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">10M</button>
            <button data-time="900" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">15M</button>
            <button data-time="1200" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">20M</button>
            <button data-time="1500" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">25M</button>
            <button data-time="1800" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold opacity-100 ring-2 ring-violet-400">30M</button>
            <button data-time="2700" class="preset-btn theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold">45M</button>
            <button id="customTimeBtn" class="theme-btn px-3.5 py-1.5 text-xs sm:text-sm font-bold flex items-center gap-1">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i> Custom
            </button>
        </div>

        <!-- Big Display Clock & Center Dynamic Visuals -->
        <div class="relative w-full flex flex-col items-center justify-center my-auto">
            
            <!-- Optional Radial Ring Progress Overlay -->
            <div id="radialRingWrapper" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-500 scale-105">
                <svg class="w-72 h-72 sm:w-96 sm:h-96" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#8b5cf6" />
                            <stop offset="50%" stop-color="#ec4899" />
                            <stop offset="100%" stop-color="#f59e0b" />
                        </linearGradient>
                    </defs>
                    <circle class="opacity-20" stroke-width="4" stroke="currentColor" fill="transparent" r="42" cx="50" cy="50"/>
                    <circle id="radialRingProgress" class="ring-circle" stroke="url(#ringGradient)" stroke-width="4" stroke-dasharray="263.89" stroke-dashoffset="263.89" stroke-linecap="round" fill="transparent" r="42" cx="50" cy="50"/>
                </svg>
            </div>

            <!-- Task Display Title -->
            <h2 id="activeTaskDisplay" class="text-sm sm:text-lg font-bold tracking-wider uppercase mb-1 drop-shadow">
                Reading & Silent Focus Time
            </h2>

            <!-- Digital Timer Numbers -->
            <div id="timeDisplay" class="font-timer font-extrabold text-7xl sm:text-8xl md:text-9xl lg:text-[11rem] tracking-tight leading-none my-1 transition-all duration-300">
                30:00
            </div>

            <!-- Subtitle Info (Elapsed / Remaining) -->
            <div class="flex items-center justify-center gap-6 text-xs sm:text-sm font-bold opacity-90 my-2">
                <span id="elapsedDisplay" class="flex items-center gap-1.5"><i data-lucide="history" class="w-4 h-4"></i> Elapsed: 00:00</span>
                <span>•</span>
                <span id="percentDisplay" class="flex items-center gap-1.5"><i data-lucide="pie-chart" class="w-4 h-4"></i> 0% Done</span>
            </div>

            <!-- Prominent Visual Main Progress Bar -->
            <div id="mainProgressBarContainer" class="w-full max-w-2xl px-4 mt-2 mb-4">
                <div class="theme-card p-2 sm:p-2.5 relative overflow-hidden">
                    <div class="w-full h-8 sm:h-11 bg-black/40 rounded-xl relative overflow-hidden p-1 shadow-inner">
                        <!-- Animated Visual Bar -->
                        <div id="mainProgressBar" class="h-full rounded-lg bg-gradient-to-r from-violet-600 via-fuchsia-500 to-amber-400 w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3">
                            <div class="w-2.5 h-full bg-white/70 rounded-full blur-[1px] animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Action Controls Footer -->
    <footer id="footerControls" class="relative z-20 w-full px-4 pb-6 pt-2 flex flex-col items-center justify-center">
        <div class="theme-card p-2.5 flex items-center space-x-3 sm:space-x-5">
            
            <!-- -1 Min -->
            <button id="minusOneBtn" title="-1 Minute" class="theme-btn p-3">
                <div class="flex items-center text-xs font-bold gap-0.5"><i data-lucide="minus" class="w-4 h-4"></i>1m</div>
            </button>

            <!-- Reset Button -->
            <button id="resetBtn" title="Reset Timer" class="theme-btn p-3.5">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
            </button>

            <!-- MAIN PLAY / PAUSE BUTTON -->
            <button id="playPauseBtn" class="p-5 sm:p-6 theme-btn bg-gradient-to-r from-violet-500 to-pink-500 text-white shadow-xl transform hover:scale-105 active:scale-95 transition-all duration-200 flex items-center justify-center">
                <i id="playPauseIcon" data-lucide="play" class="w-8 h-8 fill-current translate-x-0.5"></i>
            </button>

            <!-- +1 Min -->
            <button id="plusOneBtn" title="+1 Minute" class="theme-btn p-3">
                <div class="flex items-center text-xs font-bold gap-0.5"><i data-lucide="plus" class="w-4 h-4"></i>1m</div>
            </button>

            <!-- +5 Min -->
            <button id="plusFiveBtn" title="+5 Minutes" class="theme-btn p-3">
                <div class="flex items-center text-xs font-bold gap-0.5"><i data-lucide="plus" class="w-4 h-4"></i>5m</div>
            </button>

        </div>

        <p class="text-[11px] opacity-75 mt-3 font-semibold tracking-wide">
            Shortcuts: <kbd class="px-1.5 py-0.5 rounded bg-black/20">Space</kbd> Start/Pause • 
            <kbd class="px-1.5 py-0.5 rounded bg-black/20">R</kbd> Reset • 
            <kbd class="px-1.5 py-0.5 rounded bg-black/20">F</kbd> Fullscreen
        </p>
    </footer>

    <!-- Settings Preferences Modal -->

    <div id="finishedModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-lg flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-500">

            <button id="dismissFinishedBtn" class="w-full py-3.5 theme-btn bg-gradient-to-r from-violet-600 to-pink-600 text-white font-bold text-base shadow-lg">

    <script>
        // --- TIMER STATE MANAGEMENT ---
        const state = {
            totalSeconds: 1800,
            remainingSeconds: 1800,
            isRunning: false,
            endTime: null,
            timerInterval: null,
            skin: 'aura',
            ambientSound: 'chiptune',
            alarmSound: 'singing-bowl'
        };

        // --- WEB AUDIO API SYNTHESIZER ENGINE ---
        let audioCtx = null;
        let ambientAudioLoop = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function setAmbientSound(soundType) {
            state.ambientSound = soundType;
            document.getElementById('ambientHeaderSelect').value = soundType;
            document.getElementById('ambientSoundSelect').value = soundType;

            if (ambientAudioLoop) {
                if (ambientAudioLoop.stop) ambientAudioLoop.stop();
                if (ambientAudioLoop.interval) clearInterval(ambientAudioLoop.interval);
                ambientAudioLoop = null;
            }

            if (!state.isRunning || soundType === 'none') return;
            const ctx = getAudioContext();

            if (soundType === 'rain') {
                const bufferSize = ctx.sampleRate * 2;
                const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const whiteNoise = ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800;

                const gain = ctx.createGain();
                gain.gain.value = 0.15;

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                whiteNoise.start();

                ambientAudioLoop = { stop: () => { whiteNoise.stop(); } };
            } 
            else if (soundType === 'synth') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 130.81; // C3
                gain.gain.value = 0.08;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();

                ambientAudioLoop = { stop: () => { osc.stop(); } };
            }
            else if (soundType === 'chiptune') {
                // Polyphonic 8-bit randomized chiptune generator
                let step = 0;
                const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
                
                const timerId = setInterval(() => {
                    if (!state.isRunning) return;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    
                    const note = notes[Math.floor(Math.random() * notes.length)];
                    osc.frequency.value = note;

                    gain.gain.setValueAtTime(0.04, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);

                    step = (step + 1) % 16;
                }, 180);

                ambientAudioLoop = { interval: timerId, stop: () => clearInterval(timerId) };
            }
            else if (soundType === 'heroic') {
                // Extended 16-count (32-step) John Williams style superhero theme loop
                let step = 0;
                const leadSequence = [
                    261.63, 261.63, 392.00, 392.00, 523.25, 523.25, 493.88, 440.00,
                    392.00, 349.23, 329.63, 293.66, 392.00, 392.00, 523.25, 659.25,
                    698.46, 659.25, 587.33, 523.25, 493.88, 440.00, 392.00, 349.23,
                    329.63, 349.23, 392.00, 440.00, 523.25, 493.88, 523.25, 523.25
                ];

                const timerId = setInterval(() => {
                    if (!state.isRunning) return;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    
                    const freq = leadSequence[step % 32];
                    osc.frequency.value = freq;

                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 1200;

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start();
                    osc.stop(ctx.currentTime + 0.22);

                    step++;
                }, 250);

                ambientAudioLoop = { interval: timerId, stop: () => clearInterval(timerId) };
            }
            else if (soundType === 'waves') {
                const bufferSize = ctx.sampleRate * 3;
                const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const brownNoise = ctx.createBufferSource();
                brownNoise.buffer = noiseBuffer;
                brownNoise.loop = true;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;

                const gain = ctx.createGain();
                gain.gain.value = 0.1;

                brownNoise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                brownNoise.start();

                ambientAudioLoop = { stop: () => { brownNoise.stop(); } };
            }
            else if (soundType === 'pinknoise') {
                const bufferSize = ctx.sampleRate * 2;
                const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    output[i] *= 0.05;
                    b6 = white * 0.115926;
                }
                const pinkNoise = ctx.createBufferSource();
                pinkNoise.buffer = noiseBuffer;
                pinkNoise.loop = true;

                const gain = ctx.createGain();
                gain.gain.value = 0.12;

                pinkNoise.connect(gain);
                gain.connect(ctx.destination);
                pinkNoise.start();

                ambientAudioLoop = { stop: () => { pinkNoise.stop(); } };
            }
        }

        function playAlarmSound(alarmType) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            if (alarmType === 'singing-bowl') {
                const freqs = [216, 432, 648];
                freqs.forEach(f => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 3.5);
                });
            } else if (alarmType === 'retro-fanfare') {
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    const startTime = now + idx * 0.1;
                    gain.gain.setValueAtTime(0.12, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.25);
                });
            } else if (alarmType === 'anime-chime') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const startTime = now + idx * 0.08;
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.4);
                });
            } else if (alarmType === 'deco-gong') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 110; // A2
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 4.0);
            } else if (alarmType === 'hero-fanfare') {
                const chord = [261.63, 329.63, 392.00, 523.25];
                chord.forEach(freq => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 2.5);
                });
            }
        }

        // --- TIMER CORE LOGIC ---
        function formatTime(totalSec) {
            const mins = Math.floor(totalSec / 60);
            const secs = totalSec % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function tick() {
            const now = Date.now();
            const remainingMs = Math.max(0, state.endTime - now);
            state.remainingSeconds = Math.ceil(remainingMs / 1000);

            updateDisplay();

            if (remainingMs <= 0) {
                pauseTimer();
                playAlarmSound(state.alarmSound);
                const finishedModal = document.getElementById('finishedModal');
                if (finishedModal) {
                    finishedModal.classList.remove('opacity-0', 'pointer-events-none');
                }
            }
        }

        function startTimer() {
            if (state.remainingSeconds <= 0) return;
            getAudioContext();
            state.isRunning = true;

            document.getElementById('stateBadge').classList.remove('hidden');
            document.getElementById('playPauseIcon').setAttribute('data-lucide', 'pause');
            lucide.createIcons();

            state.endTime = Date.now() + state.remainingSeconds * 1000;
            state.timerInterval = setInterval(tick, 100);

            setAmbientSound(state.ambientSound);
        }

        function pauseTimer() {
            state.isRunning = false;
            clearInterval(state.timerInterval);

            document.getElementById('stateBadge').classList.add('hidden');
            document.getElementById('playPauseIcon').setAttribute('data-lucide', 'play');
            lucide.createIcons();

            if (ambientAudioLoop) {
                if (ambientAudioLoop.stop) ambientAudioLoop.stop();
                if (ambientAudioLoop.interval) clearInterval(ambientAudioLoop.interval);
                ambientAudioLoop = null;
            }
        }

        function resetTimer(newTimeSec) {
            pauseTimer();
            if (newTimeSec !== undefined) {
                state.totalSeconds = newTimeSec;
            }
            state.remainingSeconds = state.totalSeconds;
            updateDisplay();
            if (typeof window.saveUserSettings === 'function' && newTimeSec !== undefined) {
                window.saveUserSettings();
            }
        }

        // --- BACKGROUND CANVAS PARTICLES ---
        let canvas, ctx, animationFrameId;
        let particles = [];

        function initParticles() {
            canvas = document.getElementById('auraCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            particles = [];
            const count = state.skin === 'retro' ? 40 : state.skin === 'anime' ? 50 : 30;

            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * (state.skin === 'aura' ? 80 : 4) + 2,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    color: getParticleColor(state.skin),
                    alpha: Math.random() * 0.5 + 0.2
                });
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animateParticles();
        }

        function getParticleColor(skin) {
            if (skin === 'aura') {
                const colors = ['rgba(139, 92, 246, ', 'rgba(236, 72, 153, ', 'rgba(245, 158, 11, '];
                return colors[Math.floor(Math.random() * colors.length)];
            } else if (skin === 'retro') {
                return 'rgba(0, 230, 118, ';
            } else if (skin === 'anime') {
                const colors = ['rgba(0, 255, 102, ', 'rgba(193, 255, 0, ', 'rgba(255, 135, 54, ', 'rgba(253, 78, 78, '];
                return colors[Math.floor(Math.random() * colors.length)];
            } else if (skin === 'deco') {
                const colors = ['rgba(224, 122, 95, ', 'rgba(208, 106, 76, ', 'rgba(42, 157, 143, '];
                return colors[Math.floor(Math.random() * colors.length)];
            } else {
                const colors = ['rgba(10, 49, 97, ', 'rgba(76, 154, 42, ', 'rgba(162, 0, 3, ', 'rgba(255, 199, 44, '];
                return colors[Math.floor(Math.random() * colors.length)];
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color + p.alpha + ')';
                ctx.fill();
            });

            animationFrameId = requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });

        // --- DOM UPDATES & EVENT LISTENERS ---
        function updateDisplay() {
            const timeDisplay = document.getElementById('timeDisplay');
            timeDisplay.textContent = formatTime(state.remainingSeconds);
            document.title = `${formatTime(state.remainingSeconds)} - ${taskTitleInput.value || 'Timer'}`;

            const elapsedSec = state.totalSeconds - state.remainingSeconds;
            document.getElementById('elapsedDisplay').innerHTML = `<i data-lucide="history" class="w-4 h-4"></i> Elapsed: ${formatTime(elapsedSec)}`;
            
            const percentRemaining = state.totalSeconds > 0 ? (state.remainingSeconds / state.totalSeconds) * 100 : 0;
            const percentElapsed = state.totalSeconds > 0 ? (elapsedSec / state.totalSeconds) * 100 : 0;

            document.getElementById('percentDisplay').innerHTML = `<i data-lucide="pie-chart" class="w-4 h-4"></i> ${Math.round(percentElapsed)}% Done`;

            // Both progress bars & radial ring fill up (counting UP from 0% to 100%)
            document.getElementById('topProgressBar').style.width = `${percentElapsed}%`;
            document.getElementById('mainProgressBar').style.width = `${percentElapsed}%`;

            const circumference = 263.89;
            const offset = circumference - (percentElapsed / 100) * circumference;
            document.getElementById('radialRingProgress').style.strokeDashoffset = offset;

            lucide.createIcons();
        }

        function updateRingGradient(skinName) {
            const ringGrad = document.getElementById('ringGradient');
            if (!ringGrad) return;

            let stopsHTML = '';
            if (skinName === 'aura') {
                stopsHTML = `
                    <stop offset="0%" stop-color="#8b5cf6" />
                    <stop offset="50%" stop-color="#ec4899" />
                    <stop offset="100%" stop-color="#f59e0b" />
                `;
            } else if (skinName === 'retro') {
                stopsHTML = `
                    <stop offset="0%" stop-color="#003814" />
                    <stop offset="50%" stop-color="#00b140" />
                    <stop offset="100%" stop-color="#00e676" />
                `;
            } else if (skinName === 'anime') {
                stopsHTML = `
                    <stop offset="0%" stop-color="#00ff66" />
                    <stop offset="33%" stop-color="#c1ff00" />
                    <stop offset="66%" stop-color="#ff8736" />
                    <stop offset="100%" stop-color="#fd4e4e" />
                `;
            } else if (skinName === 'deco') {
                stopsHTML = `
                    <stop offset="0%" stop-color="#e07a5f" />
                    <stop offset="50%" stop-color="#d1b280" />
                    <stop offset="100%" stop-color="#2a9d8f" />
                `;
            } else if (skinName === 'comic') {
                stopsHTML = `
                    <stop offset="0%" stop-color="#0a3161" />
                    <stop offset="33%" stop-color="#4c9a2a" />
                    <stop offset="66%" stop-color="#a20003" />
                    <stop offset="100%" stop-color="#ffc72c" />
                `;
            }
            ringGrad.innerHTML = stopsHTML;
        }

        function switchSkin(skinName) {
            state.skin = skinName;
            document.body.setAttribute('data-skin', skinName);
            document.getElementById('skinSelect').value = skinName;

            const logoIcon = document.getElementById('logoIcon');
            const mainProgressBar = document.getElementById('mainProgressBar');
            const topProgressBar = document.getElementById('topProgressBar');
            
            if (skinName === 'aura') {
                logoIcon.setAttribute('data-lucide', 'sparkles');
                state.alarmSound = 'singing-bowl';
                mainProgressBar.className = 'h-full rounded-lg bg-gradient-to-r from-violet-600 via-fuchsia-500 to-amber-400 w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3';
                topProgressBar.className = 'h-full bg-gradient-to-r from-violet-500 via-fuchsia-400 to-amber-300 w-full transition-all duration-300 progress-shimmer';
            } else if (skinName === 'retro') {
                logoIcon.setAttribute('data-lucide', 'gamepad-2');
                state.alarmSound = 'retro-fanfare';
                mainProgressBar.className = 'h-full rounded-lg bg-gradient-to-r from-[#003814] via-[#00b140] to-[#00e676] w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3';
                topProgressBar.className = 'h-full bg-gradient-to-r from-[#00b140] to-[#00e676] w-full transition-all duration-300 progress-shimmer';
            } else if (skinName === 'anime') {
                logoIcon.setAttribute('data-lucide', 'zap');
                state.alarmSound = 'anime-chime';
                mainProgressBar.className = 'h-full rounded-lg bg-gradient-to-r from-[#00ff66] via-[#c1ff00] via-[#ffcc00] via-[#ff8736] to-[#fd4e4e] w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3';
                topProgressBar.className = 'h-full bg-gradient-to-r from-[#00ff66] via-[#ffcc00] to-[#fd4e4e] w-full transition-all duration-300 progress-shimmer';
            } else if (skinName === 'deco') {
                logoIcon.setAttribute('data-lucide', 'crown');
                state.alarmSound = 'deco-gong';
                mainProgressBar.className = 'h-full rounded-lg bg-gradient-to-r from-[#e07a5f] via-[#d1b280] to-[#2a9d8f] w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3';
                topProgressBar.className = 'h-full bg-gradient-to-r from-[#e07a5f] via-[#2a9d8f] to-[#00b4d8] w-full transition-all duration-300 progress-shimmer';
            } else if (skinName === 'comic') {
                logoIcon.setAttribute('data-lucide', 'flame');
                state.alarmSound = 'hero-fanfare';
                mainProgressBar.className = 'h-full rounded-lg bg-gradient-to-r from-[#0a3161] via-[#6b2d82] via-[#4c9a2a] via-[#a20003] to-[#ffc72c] w-full transition-all duration-300 progress-shimmer flex items-center justify-end pr-3';
                topProgressBar.className = 'h-full bg-gradient-to-r from-[#0a3161] via-[#4c9a2a] to-[#ffc72c] w-full transition-all duration-300 progress-shimmer';
            }

            updateRingGradient(skinName);
            document.getElementById('alarmSoundSelect').value = state.alarmSound;

            initParticles();
            lucide.createIcons();
            updateDisplay();

            if (typeof window.saveUserSettings === 'function') {
                window.saveUserSettings({ skin: skinName });
            }
        }

        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (state.isRunning) pauseTimer();
            else startTimer();
        });

        document.getElementById('resetBtn').addEventListener('click', () => resetTimer());

        document.getElementById('plusOneBtn').addEventListener('click', () => {
            state.totalSeconds += 60;
            state.remainingSeconds += 60;
            if (state.isRunning) state.endTime += 60000;
            updateDisplay();
        });

        document.getElementById('plusFiveBtn').addEventListener('click', () => {
            state.totalSeconds += 300;
            state.remainingSeconds += 300;
            if (state.isRunning) state.endTime += 300000;
            updateDisplay();
        });

        document.getElementById('minusOneBtn').addEventListener('click', () => {
            if (state.remainingSeconds <= 60) return;
            state.totalSeconds = Math.max(1, state.totalSeconds - 60);
            state.remainingSeconds -= 60;
            if (state.isRunning) state.endTime -= 60000;
            updateDisplay();
        });

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const timeSec = parseInt(btn.getAttribute('data-time'), 10);
                resetTimer(timeSec);
            });
        });

        const taskTitleInput = document.getElementById('taskTitleInput');
        taskTitleInput.addEventListener('input', (e) => {
            document.getElementById('activeTaskDisplay').textContent = e.target.value || 'Focus Session';
            if (typeof window.saveUserSettings === 'function') {
                window.saveUserSettings({ taskTitle: e.target.value });
            }
        });

        document.getElementById('skinSelect').addEventListener('change', (e) => {
            switchSkin(e.target.value);
        });

        document.getElementById('ambientHeaderSelect').addEventListener('change', (e) => {
            setAmbientSound(e.target.value);
            if (typeof window.saveUserSettings === 'function') {
                window.saveUserSettings({ ambientSound: e.target.value });
            }
        });

        document.getElementById('skinSelect').addEventListener('change', (e) => {
            switchSkin(e.target.value);
        });

        document.getElementById('ambientHeaderSelect').addEventListener('change', (e) => {
            setAmbientSound(e.target.value);
        });

        document.querySelectorAll('.skin-modal-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchSkin(btn.getAttribute('data-set-skin'));
            });
        });

        // Settings Modal
        const settingsModal = document.getElementById('settingsModal');
        document.getElementById('settingsBtn').addEventListener('click', () => {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
        });
        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
        });
        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            const selectedSound = document.getElementById('ambientSoundSelect').value;
            state.alarmSound = document.getElementById('alarmSoundSelect').value;
            setAmbientSound(selectedSound);
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            if (typeof window.saveUserSettings === 'function') {
                window.saveUserSettings();
            }
        });

        document.getElementById('testAlarmSoundBtn').addEventListener('click', () => {
            playAlarmSound(document.getElementById('alarmSoundSelect').value);
        });

        // Custom Time Modal
        const customTimeModal = document.getElementById('customTimeModal');
        document.getElementById('customTimeBtn').addEventListener('click', () => {
            customTimeModal.classList.remove('opacity-0', 'pointer-events-none');
        });
        document.getElementById('cancelCustomTimeBtn').addEventListener('click', () => {
            customTimeModal.classList.add('opacity-0', 'pointer-events-none');
        });
        document.getElementById('applyCustomTimeBtn').addEventListener('click', () => {
            const mins = parseInt(document.getElementById('customMinutesInput').value, 10) || 0;
            const secs = parseInt(document.getElementById('customSecondsInput').value, 10) || 0;
            resetTimer(Math.max(1, mins * 60 + secs));
            customTimeModal.classList.add('opacity-0', 'pointer-events-none');
        });

        document.getElementById('dismissFinishedBtn').addEventListener('click', () => {
            document.getElementById('finishedModal').classList.add('opacity-0', 'pointer-events-none');
            resetTimer();
        });

        // Fullscreen Toggle
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                document.getElementById('fullscreenIcon').setAttribute('data-lucide', 'minimize-2');
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                document.getElementById('fullscreenIcon').setAttribute('data-lucide', 'maximize-2');
            }
            lucide.createIcons();
        });

        // Progress bar vs ring switcher
        const styleBarBtn = document.getElementById('styleBarBtn');
        const styleRingBtn = document.getElementById('styleRingBtn');
        const mainProgressBarContainer = document.getElementById('mainProgressBarContainer');
        const radialRingWrapper = document.getElementById('radialRingWrapper');

        styleBarBtn.addEventListener('click', () => {
            mainProgressBarContainer.classList.remove('hidden');
            radialRingWrapper.classList.add('opacity-0');
            if (typeof window.saveUserSettings === 'function') {
                window.saveUserSettings({ progressStyle: 'bar' });
            }
        });

        styleRingBtn.addEventListener('click', () => {
            mainProgressBarContainer.classList.add('hidden');
            radialRingWrapper.classList.remove('opacity-0');
            if (typeof window.saveUserSettings === 'function') {
                window.saveUserSettings({ progressStyle: 'ring' });
            }
        });

        styleRingBtn.addEventListener('click', () => {
            mainProgressBarContainer.classList.add('hidden');
            radialRingWrapper.classList.remove('opacity-0');
        });

        // Key shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); document.getElementById('playPauseBtn').click(); }
            else if (e.code === 'KeyR') document.getElementById('resetBtn').click();
            else if (e.code === 'KeyF') fullscreenBtn.click();
        });

        window.onload = function() {
            initParticles();
            lucide.createIcons();
            updateDisplay();
        };
    </script>
</body>
</html>
